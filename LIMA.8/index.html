<html lang="pt-br"
<head>
</head>
<body>
<!--
   <Form>    = Define um formulário
    <input>  = Campo de entrada (Com vários tipos: text, passaword, email, number, etc..)
    <label>  = Associa um texto descritivo a um <input>
    <textrea> = Area de texto maior.
    <select> e <option> = Criam menus suspensos (dropdrwns)
    <button> = Botão clicável 
    <fieldset> e <legend> = Agrupam e nomeiam partes de um formulário 
    <datalist> = Lista de sugestções para <input>

-->
        <h1>Formulário Completo</h1>

        <form action="/enviar-dados" method="post">
       <fieldset>
        <legend>Informações Pessoais</legend> 

        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome"
        placeholder="Digite seu nome" reaquired>
    
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email"
        placeholder="seuemail@euamosenai.com.br"
        required><br>

        <label for="senha">Senha:</label>
        <input type="senha" id="senha" name="senha"
        required>


        <label for="Idade">idade:</label>
        <input type="number" id="idade" name="idade"
        min="18" max="99"

        <label for="data-nacismento">Data Nascimento</label>
         <inpu type="data-nacismento" id="data-nacismento" ></inpu>
       
         <label for="genero>Gênero</label>
         <select name="genero" id="genero">
            <option value="masculino">Masculinp</option>
            <option value="feminino">Feminino</option>
            <option value="outro">Outro</option>
            <option value="prefiro_não_dizer">Prefiro não dizer</option>
         </select>
        </fieldset>

        <fieldset>
            <legend>Detalhes Adicionais</legend>

            <label for="bio">Sobre você:</label>
            <textarea id="Bio" name="Bio" rows="3"
            placeholder="Fale um pouco de você..."
            </textarea>

            <label for="Linguagem">linguagem favorita:</label>
            <input type="text" name="linguagem" id="linguagem"
            datalist id="linguagens">
                <option value="HTML">
                <option value="CSS">
                <option value="JavaScript">
                <option value="Python"></option>
                <option value="Java>"></option>
            </datalist>
            
        
        </fieldset>


        </form>
   

</body>
