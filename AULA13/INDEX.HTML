<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,width, initial-scale=1.0">
        <title>Entendo o Display</title>
        <link rel="stylesheet" href="./style.CSS">

    </head>
    <body>

          <h1>Entendo o Display</h1>


          <p>
          O <strong>Display</strong> define como um elemento se comporta na página
        </p>

        <!--block-->
        <h2>1.block</h2>
        <div class="block">Caixa 1</div>
        <div class="block">Caixa 2</div>
        <div class="block">Caixa 3</div>
        
        <!--Inline-->
        <h2>2.Inline</h2>
        <div class="block">Caixa 4</div>
        <div class="block">Caixa 5</div>
        <div class="block">Caixa 6</div>

        <!--Inline Block-->
        <h2>2.Inline Block</h2>
        <div class="Inline-block">Caixa 7</div>
        <div class="Inline-block">Caixa 8</div>
        <div class="Inline-block">Caixa 9</div>


    </body>
    </html>
